<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakUp Buddy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>SpeakUp Buddy 🗣️</h1>
    <p>Pick a situation and practice with your buddy</p>
  </header>

  <main class="grid">
    <div class="card">
      <h2>🍽️ Restaurant</h2>
      <p>Order food and ask for the bill.</p>
      <button>Practice</button>
    </div>

    <div class="card">
      <h2>🚌 Bus Stop</h2>
      <p>Ask for directions and ticket prices.</p>
      <button>Practice</button>
    </div>

    <div class="card">
      <h2>💼 Job Interview</h2>
      <p>Introduce yourself and answer questions.</p>
      <button>Practice</button>
    </div>
  </main>
</body>
</html>
